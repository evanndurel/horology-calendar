# Keeps the free Supabase database awake: Supabase pauses free projects
# after a week without activity. This makes one small read every day.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → add
# SUPABASE_URL and SUPABASE_ANON_KEY (same values as on Vercel).
name: Keep database awake
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/events?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null && echo "ok"
